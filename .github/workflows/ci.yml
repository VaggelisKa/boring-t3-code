name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run -r --concurrency-limit 2 typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      # Server preview tests drive a headless Chromium through Playwright.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: vp test run apps/server packages
      - run: vp test run --passWithNoTests --project unit
        working-directory: apps/web

  browser-test:
    name: Web browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: vp test run --passWithNoTests --project browser
        working-directory: apps/web
