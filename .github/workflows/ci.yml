name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp run lint

      - name: Knip
        run: vp run knip:check

      - name: Typecheck
        run: vp run -r --concurrency-limit 2 typecheck

      # Server preview and web browser tests drive a headless Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Server, desktop and package tests
        run: vp test run apps/server apps/desktop packages

      - name: Web tests
        run: vp test run --passWithNoTests --project unit --project browser
        working-directory: apps/web
